name: Get linked issues
on:
  pull_request:
    types: [ edited, synchronize, opened, reopened ]

jobs:
  check-linked-issues:
    name: Check if pull request has linked issues
    if:  ${{ !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - name: Get issues
        id: get-issues
        uses: mondeja/pr-linked-issues-action@v2
        # The action reads the token from this env var. github.token is the token GitHub creates
        # for every run (no stored secret); the permissions above limit it to read access.
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: PR has not linked issues
        if: join(steps.get-issues.outputs.issues) == ''
        run:
          exit 1
